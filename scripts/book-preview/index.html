<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><title>Book Studio — 本の制作プレビュー</title>
  <link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="./studio.css"><script src="./launch.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/" aria-label="Book Studio ホーム">Book Studio</a>
    <div class="book-picker"><label for="book-select" class="sr-only">制作する本</label><select id="book-select" aria-label="制作する本"><option>読み込み中…</option></select><span id="book-category" class="category-label"></span></div>
    <div class="sync-group"><span id="sync" class="sync" role="status">接続中</span><button id="reload" class="icon-button" type="button" aria-label="原稿を再読み込み" title="原稿を再読み込み">↻</button></div>
    <h1 id="book-title" class="sr-only">原稿を読み込んでいます</h1><span id="book-status" hidden></span>
  </header>
  <div class="studio">
    <aside class="sidebar" aria-label="本とページの選択">
      <div class="sidebar-heading"><span>構成</span><span id="page-total"></span></div>
      <nav id="contents" class="contents" aria-label="表紙と見開き"></nav>
      <p class="sidebar-note">原稿を保存すると<br>自動で反映されます。</p>
    </aside>
    <main class="workspace">
      <div class="toolbar">
        <div class="view-switch" role="group" aria-label="表示モード"><button id="cover-tab" type="button" aria-pressed="true">表紙</button><button id="spread-tab" type="button" aria-pressed="false">見開き</button></div>
        <label class="page-picker"><span class="sr-only">表示するページ</span><select id="page-select" aria-label="表示するページ"></select></label>
        <div id="project-links" class="project-links" role="group" aria-label="作品の外部リンク"></div>
      </div>
      <div id="error" class="notice error" role="alert" hidden></div><div id="warnings" class="notices" aria-live="polite"></div>
      <section id="canvas" class="canvas" aria-label="紙面プレビュー" aria-busy="true"><p class="empty-state">原稿を読み込んでいます…</p></section>
      <footer class="preview-footer"><div class="source-info"><span id="current-label">—</span><span id="source-path"></span></div><div class="pager"><button id="previous" class="icon-button" type="button" aria-label="前の見開き" disabled>←</button><span id="position" aria-live="polite">—</span><button id="next" class="icon-button" type="button" aria-label="次の見開き" disabled>→</button></div></footer>
    </main>
  </div>
  <script type="module" src="./studio.js"></script>
</body>
</html>
